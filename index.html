<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPS: Lucky Hand</title>
  <link rel="stylesheet" href="rpslb.css">
</head>
<body>
  <main class="table">
    <header class="top">
      <h1>RPS: Lucky Hand</h1>

      <section class="scoreboard" aria-label="Score">
        <div><span id="score-player">0</span> You</div>
        <div><span id="score-draws">0</span> Draws</div>
        <div><span id="score-computer">0</span> Computer</div>
      </section>

      <!-- NEW: game stats (reset with every new game) -->
      <section class="stats" aria-label="Game stats">
        <div>Winrate <span id="stat-winrate">0%</span></div>
        <div>W-L <span id="stat-record">0-0</span></div>
        <div>Winstreak <span id="stat-streak">0</span></div>
      </section>

      <!-- NEW: sound on/off button (the icon is an inline SVG, no emoji) -->
      <button id="sound-toggle" class="btn sound-btn" type="button" aria-label="Turn sound off" title="Turn sound off">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" fill="currentColor"/>
          <path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18.2 6.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path class="mute" d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Computer hand (card backs) -->
    <section class="panel">
      <h2>Computer <span id="computer-count" class="count"></span></h2>
      <div id="computer-hand" class="hand"></div>
    </section>

    <!-- Dealer deck, played cards and round result -->
    <section class="panel center">
      <div class="dealer">
        <div id="deck" class="deck">
          <div class="deck-card back-design"></div>
          <div class="deck-card back-design"></div>
          <div class="deck-card back-design"></div>
        </div>
        <p class="label">Dealer</p>
      </div>
      <div id="arena" class="arena"></div>
      <div class="result" aria-live="polite">
        <p id="result-plays"></p>
        <p id="result-outcome"></p>
      </div>
    </section>

    <!-- Player hand -->
    <section class="panel">
      <h2>Player <span id="player-count" class="count"></span></h2>
      <div id="player-hand" class="hand"></div>
      <p id="switch-hint" class="label"></p>
    </section>

    <section class="controls">
      <button id="switch" class="btn">Switch Card (1 available)</button>
      <button id="confirm-switch" class="btn primary" hidden>Replace card</button>
      <button id="reset" class="btn">Reset Game</button>
      <button id="play-again" class="btn primary" hidden>Play Again</button>
    </section>
  </main>

  <!-- Confirmation dialog for "Reset Game" -->
  <div id="reset-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-text" hidden>
    <div class="modal-box">
      <h2 id="reset-title">Restart the game?</h2>
      <p id="reset-text">Your current score and cards will be lost and a new hand will be dealt.</p>
      <div class="modal-actions">
        <button id="reset-cancel" class="btn" type="button">Keep playing</button>
        <button id="reset-confirm" class="btn primary" type="button">Restart</button>
      </div>
    </div>
  </div>

  <script src="rpslb.js"></script>
</body>
  </html>
